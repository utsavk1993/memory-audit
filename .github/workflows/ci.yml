name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Fails if line, branch, function or statement coverage drops below 100% (see vitest.config.mts).
      - run: npm run test:coverage

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Plugin bundle is up to date
        run: |
          git diff --exit-code -- plugin/dist || {
            echo "::error::plugin/dist is stale. Run 'npm run build:plugin' and commit the result."
            exit 1
          }

  package:
    name: Installed package works (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Pack exactly what `npm publish` would upload (prepack builds it), install it into an empty folder
      # like a user would, then run the launcher, the CLI and the web app from there. The folder name has a
      # space to catch quoting bugs (e.g. "C:\Users\Jane Doe" on Windows).
      - name: Pack and install
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/my app" && cd "$RUNNER_TEMP/my app"
          npm init -y > /dev/null
          npm install "$RUNNER_TEMP"/memory-audit-*.tgz
      - name: Run it
        working-directory: ${{ runner.temp }}/my app
        env:
          MEMORY_AUDIT_CLAUDE_DIR: ${{ runner.temp }}/projects
        run: |
          mkdir -p "$MEMORY_AUDIT_CLAUDE_DIR/-tmp-demo/memory"
          printf -- '- [Note](note.md) - x\n' > "$MEMORY_AUDIT_CLAUDE_DIR/-tmp-demo/memory/MEMORY.md"
          printf -- '---\nname: note\ndescription: x\n---\n\nA note.\n' > "$MEMORY_AUDIT_CLAUDE_DIR/-tmp-demo/memory/note.md"
          test "$(npx memory-audit --version)" = "$(node -p 'require("memory-audit/package.json").version')"
          npx memory-audit check --project -tmp-demo
          out="$(npx memory-audit ui --port 3299)"
          echo "$out"
          curl -fsS http://127.0.0.1:3299/ | grep -q '<title>Memory Audit'
          curl -fsS http://127.0.0.1:3299/api/claude-code/projects | grep -q '"id":"-tmp-demo"'
          # Asking again finds the running app instead of starting a second one.
          again="$(npx memory-audit ui --port 3299)"
          [[ "$again" == *"already running"* ]]
          # The stop command it printed (kill on Linux, taskkill on Windows) really stops the app.
          stop="$(printf '%s' "$out" | sed -n 's/.*stop it with `\(.*\)`.*/\1/p')"
          test -n "$stop"
          MSYS_NO_PATHCONV=1 eval "$stop"
          for i in $(seq 1 20); do curl -fsS -o /dev/null http://127.0.0.1:3299/ || exit 0; sleep 1; done
          echo "::error::the app was still running after the stop command"; exit 1

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # TEMPORARY: dev packages are skipped while GHSA-fc5q-39xc-vjpf (picomatch <=4.0.7, via vitest and
      # eslint-config-next) has no patched release. Neither ships in the npm package or the hosted demo.
      # Put back `npm audit --audit-level=moderate` once picomatch publishes a fix.
      - run: npm audit --omit=dev --audit-level=moderate
